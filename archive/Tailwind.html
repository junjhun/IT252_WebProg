<!-- 
    Tailwind Discussion
    JIT Engine - compiler scans your HTML/JSX/TSX files, extracts class tokens.
    PostCSS AST - Abstract Syntax Tree, a representation of the CSS code structure. Contains only the exact rules you used.

    Arbitrary Variants
        -> [&>*] - targets all direct children of the element
        -> [&_tr]: targets all tr elements that are descendants of the element
        <tr><td><code> - You cannot manually add arbitrary variants to your HTML, but you can use them in your Tailwind config file.
        
            & - parent selector
            [&>p]:mb-4 Targets direct child paragraphs (.parent > p)

        -> Sibling State Machines - Named Peers (peer/{name})
        - peer
            CSS General Sibling Combinator ( ~ ) - selects all siblings of an element that match a given selector.
            Golden DOM Rule -> ~ only looks forward at subsequent siblings, not backward at previous siblings.
        - peer/get, peer/post, peer/delete
        - Groups - group/{name}
            CSS Descendant Combinator (space) - selects all descendants of an element that match a given selector.
            Golden DOM Rule -> space looks forward and backward at all descendants, not just subsequent siblings.
        - Dark mode
 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'ui-sans-serif', 'system-ui'],
                        'serif': ['Merriweather', 'ui-serif', 'Georgia'],
                        'mono': ['Fira Code', 'ui-monospace', 'SFMono-Regular'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom theme tokens */
        :root {
            --brand-accent: #6366f1; /* Indigo-500 */
            --brand-glow: rgba(99,102,241, 0.5); /* Indigo-500 with opacity */
        }
        .dark {
            --brand-accent: #818cf8; /* Indigo-400 */
            --brand-glow: rgba(56,189,248, 0.5); /* Sky-400 with opacity */
        }

        .profile-container {
            /* width: min(100% - 2rem, 1040px); */
            margin-inline: auto;
        }

        /* Layers */
        @layer base, components, utilities {
            /* Base styles */
            body {
                @apply bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-200 h-screen flex flex-col overflow-hidden font-sans transition-colors duration-300 select-none;
            }

            /* Components */
            .profile-container {
                @apply h-16 flex items-center justify-between;
            }

            /* Utilities */
            .hover\:text-indigo-500:hover {
                @apply text-indigo-500;
            }
        
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-200 h-screen flex flex-col overflow-hidden font-sans transition-colors duration-300 select-none">
    <!-- HEADER BAR -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 h-16 flex items-center px-4">
        <div class="profile-container h-16 flex items-center justify-between">
            <div class-="w-9 h-9 rounded-xl bg-indigo-500 flex items-center justify-center text-white text-lg font-semibold"></div>
            <div>
                <span class="font-bold text-sm text-slate-900 dark:text-white block leading-none">Felino Calderon III</span>
                <span class="text-[11px] font-mono text-slate-500 dark:text-slate-400">Fulll-Stack Developer</span>
            </div>
        </div>

        <!-- Nav -->
        <nav class="hidden md:flex items-center gap-6 text-xs font-semibold text-slate-600 dark:text-slate-400 ml-auto">
            <a href="#" class="hover:text-indigo-500 dark:hover:text-indigo-400 transition-colors duration-300">Home</a>
            <a href="#" class="hover:text-indigo-500 dark:hover:text-indigo-400 transition-colors duration-300">About</a>
            <a href="#" class="hover:text-indigo-500 dark:hover:text-indigo-400 transition-colors duration-300">Projects</a>
            <a href="#" class="hover:text-indigo-500 dark:hover:text-indigo-400 transition-colors duration-300">Contact</a>
        </nav>

        <!-- Dark Mode Toggle Button -->
        <button id="theme-toggle" class="flex items-center gap-2 bg-slate-900 dark:bg-sky-500 text-white dark:text-slate-900 px-3 py-1 rounded-full text-xs font-semibold hover:bg-slate-800 dark:hover:bg-sky-600 transition-colors duration-300">
            <svg id="icon-sun" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path>
            </svg>
            <svg id="icon-moon" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
            </svg>
            <span id="theme-text">Dark Mode</span>
        </button>


        <script>
            const toggleBtn = document.getElementById('theme-toggle');
            const themeText = document.getElementById('theme-text');
            const iconSun = document.getElementById('icon-sun');
            const iconMoon = document.getElementById('icon-moon');

            function updateThemeUI() {
                const isDark = document.documentElement.classList.contains('dark');
                if (isDark) {
                    themeText.textContent = 'Light Mode';
                    iconSun.classList.remove('hidden');
                    iconMoon.classList.add('hidden');
                } else {
                    themeText.textContent = 'Dark Mode';
                    iconSun.classList.add('hidden');
                    iconMoon.classList.remove('hidden');
                }
            }
            updateThemeUI();

            toggleBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                updateThemeUI();
            });
        </script>
    </header>
</body>
</html>
